submission:
  title: "Grid Risk Advisor — Power Outage Prediction & Equipment Failure Advisory"

  problem_statement: >
    Power utilities operate thousands of high-value transformers whose sensor data
    (dissolved gas analysis, oil temperature, dielectric measurements) is rarely
    combined into a unified risk signal, leaving grid operators to discover faults
    after failure rather than preventing them. Grid maintenance crews are dispatched
    reactively, at 3-7x the cost of planned intervention.

  solution_summary: >
    Grid Risk Advisor combines two ML models trained on real Kaggle transformer
    datasets — a Health Index regression (R²=0.72) and a DGA Fault Classifier
    (accuracy 90.8%) — into a single pipeline that scores all 18 grid assets,
    ranks them by composite grid impact severity, generates fault-type-specific
    maintenance actions, and produces IBM Bob-grounded plain-English advisories.
    The TX-115 case demonstrates the key value: an imminent failure (RUL 7.7 days)
    was detected and a targeted intervention recovered 89 additional days of asset life.

  key_features:
    - "Two trained ML models on real Kaggle data: Health Index regression (R²=0.72) + DGA Fault Classifier (90.8% accuracy, 7 fault classes)"
    - "Composite grid impact ranking: 5-component weighted formula (HI 35%, RUL 25%, fault severity 20%, MVA 10%, history 10%) with criticality multiplier"
    - "TX-115 intervention detection: system tracks degradation, detects maintenance-driven recovery, and communicates it explicitly (not 'still at risk')"
    - "IBM Bob (Claude) integration: per-asset plain-English advisories grounded in actual sensor values and SHAP contributions, with graceful fallback"
    - "FastAPI backend (9 endpoints) + VOLTRA interactive intelligence console (React 19, TanStack Start, TailwindCSS) with real pipeline output — no mock data"

  tech_stack:
    languages: ["Python", "TypeScript", "JavaScript", "HTML", "CSS"]
    frameworks: ["FastAPI", "scikit-learn", "SHAP", "pandas", "numpy", "uvicorn", "React 19", "TanStack Start", "TailwindCSS"]
    ibm_technologies: ["IBM Bob (Claude claude-3-5-haiku-20241022)"]
    databases: []
    other: ["kagglehub", "Open-Meteo API (real weather data)", "Kaggle transformer datasets"]

  what_we_are_most_proud_of: >
    The TX-115 intervention and stalled recovery story is the strongest part of this
    submission. It is not a toy example — the degradation trajectory, the peak at
    Day 78 (RUL 7.7 days), the maintenance event, and the measurable recovery to
    RUL 97 days are all traceable through the actual pipeline code, data, and API
    responses. This demonstrates the system's core value proposition: not just
    detecting imminent failure, but detecting when a previous intervention worked.
    The IBM Bob integration is also genuinely load-bearing — advisories are grounded
    in real SHAP values and actual sensor readings, not generic templates.

  known_limitations: >
    1. Health Index model R² = 0.717 (not the 0.76 target). This reflects a known
       citable limitation of real DGA datasets: absence of furan and DP (degree of
       polymerisation) measurements needed to capture paper insulation aging
       (IEEE C57.104, CIGRE TB 296). This is a dataset gap, not a modelling flaw.
    2. DGA Fault Classifier T2 recall = 0.743. The T2 class (moderate thermal fault)
       is confused with T1 and T3. This is documented in every T2 advisory output and
       in the dashboard UI. No output claims zero missed failures.
    3. RUL estimates are heuristic — no ground-truth RUL labels exist in either dataset.
       The calibration is documented and reproducible.
    4. The 18-asset synthetic time-series uses real model-1 feature distributions but
       the extreme archetype values (TX-107 C2H2 at 2,790 ppm) are extrapolation
       territory for the real RF model — the model's predictions in this range are
       extrapolated, not interpolated.
    5. No user authentication — the API is open on localhost. Not production-ready.
    6. IBM Bob advisory generation requires ANTHROPIC_API_KEY; fallback is always available.

