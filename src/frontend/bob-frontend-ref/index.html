<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VOLTRA — AI-Powered Grid Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/assets/cinematic/first-frame.webp" type="image/webp" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- Fullscreen Cinematic Canvas Container -->
    <main id="cinematicContainer" class="fullscreen-cinematic"></main>

    <!-- Minimalist Floating Theme Toggle -->
    <div class="theme-controls">
      <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle Day / Night theme">
        <span class="theme-icon" id="themeIcon">☾</span>
        <span class="theme-label" id="themeLabel">Night Mode</span>
      </button>
    </div>

    <!-- Ambient Bottom Explore Pill Indicator -->
    <div class="explore-indicator-container">
      <button
        id="exploreTrigger"
        class="explore-trigger-btn"
        aria-label="Explore VOLTRA Grid Intelligence"
      >
        <span class="explore-pulse"></span>
        <span class="explore-text">Explore Grid Intelligence</span>
        <span class="explore-arrow">↓</span>
      </button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
