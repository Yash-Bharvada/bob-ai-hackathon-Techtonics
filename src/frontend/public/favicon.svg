<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040914" />
      <stop offset="50%" stop-color="#081426" />
      <stop offset="100%" stop-color="#0e2344" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="50%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#bef264" />
      <stop offset="70%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="coreGlow" cx="50%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#a3e635" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#040914" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Badge with Rounded Chamfer -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Ambient Energy Radial Core -->
  <circle cx="256" cy="270" r="180" fill="url(#coreGlow)" />

  <!-- Ambient Grid Lines Subtle -->
  <g opacity="0.12" stroke="#00f0ff" stroke-width="2">
    <line x1="80" y1="256" x2="432" y2="256" stroke-dasharray="8 8" />
    <line x1="256" y1="80" x2="256" y2="432" stroke-dasharray="8 8" />
    <circle cx="256" cy="256" r="140" fill="none" stroke-dasharray="6 6" />
  </g>

  <!-- Left Arm of VOLTRA 'V' (Cyan Power Bar) -->
  <path d="M 124 136 L 194 136 L 256 320 L 210 376 L 124 136 Z" fill="url(#cyanGrad)" filter="url(#glow)" />

  <!-- Dynamic Voltage Lightning Bolt (Integrated Right Wing & Slicing Bolt) -->
  <path d="M 388 136 L 272 268 L 322 268 L 220 404 L 260 292 L 208 292 L 318 136 Z" fill="url(#boltGrad)" filter="url(#glow)" />

  <!-- High-Energy Center Spark Apex -->
  <polygon points="256,220 266,248 294,256 266,264 256,292 246,264 218,256 246,248" fill="#ffffff" opacity="0.95" />
</svg>